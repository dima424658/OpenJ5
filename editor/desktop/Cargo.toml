[package]
name = "janvar-editor-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "janvar-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
janvar-editor = { path = ".." }
janvar-flash = { path = "../flash" }
rfd = "0.15.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSGeometry", "NSRange"] }
raw-window-handle = "0.6"
muda = { version = "0.21.1", default-features = false }
